<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" role="img" aria-label="Four steps of the Afterglow Method: Flow for 30 minutes or more, the afterglow window with a freestyle or guided reflection, Harvest, and living by it. Modern noise is jagged at the start and smooths out during Flow, then your inner voice comes through in the window.">
